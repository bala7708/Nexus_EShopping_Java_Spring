<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Products — Admin NEXUS</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav class="navbar">
  <a th:href="@{/admin}" class="navbar-brand">NEX<span>US</span> <span style="font-size:0.75rem; color:var(--text-muted); font-family:'DM Sans',sans-serif; font-weight:400; margin-left:0.5rem">Admin</span></a>
  <ul class="navbar-nav">
    <li><a th:href="@{/shop}" class="nav-link">← Storefront</a></li>
    <li><a th:href="@{/auth/logout}" class="nav-link">Sign Out</a></li>
  </ul>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Overview</div>
      <a th:href="@{/admin}" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Catalog</div>
      <a th:href="@{/admin/products}" class="sidebar-link active"><span class="icon">📦</span> Products</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Commerce</div>
      <a th:href="@{/admin/orders}" class="sidebar-link"><span class="icon">🛍</span> Orders</a>
      <a th:href="@{/admin/users}" class="sidebar-link"><span class="icon">👥</span> Users</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="flex-between mb-4">
      <div>
        <h2 class="font-serif" style="font-size:1.75rem">Products</h2>
        <p class="text-secondary text-sm mt-1"><span th:text="${products.size()}"></span> total products</p>
      </div>
      <a th:href="@{/admin/products/new}" class="btn btn-primary">+ Add Product</a>
    </div>

    <div th:if="${success}" class="alert alert-success fade-in">✓ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-error fade-in">⚠ <span th:text="${error}"></span></div>

    <div class="table-wrap fade-in">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="product : ${products}">
            <td>
              <div style="display:flex; align-items:center; gap:0.75rem">
                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}"
                     style="width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border-subtle)">
                <div>
                  <div style="font-weight:600" th:text="${product.name}"></div>
                  <div class="text-xs text-muted" th:text="'#' + ${product.id}"></div>
                </div>
              </div>
            </td>
            <td><span class="filter-chip" style="cursor:default" th:text="${product.category}"></span></td>
            <td><strong th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></strong></td>
            <td>
              <span th:text="${product.stockQuantity}"
                    th:style="${product.stockQuantity == 0} ? 'color:var(--accent-coral)' : ''"></span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${product.active} ? 'badge-active' : 'badge-inactive'"
                    th:text="${product.active} ? 'Active' : 'Hidden'"></span>
            </td>
            <td>
              <div class="flex-gap">
                <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                   class="btn btn-outline btn-sm">Edit</a>

                <form th:action="@{/admin/products/toggle/{id}(id=${product.id})}" method="post" style="display:inline">
                  <button type="submit" class="btn btn-outline btn-sm"
                          th:text="${product.active} ? 'Hide' : 'Show'"></button>
                </form>

                <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post"
                      onsubmit="return confirm('Delete this product?')">
                  <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${products.isEmpty()}">
            <td colspan="6" style="text-align:center; color:var(--text-muted); padding:3rem">
              No products yet. <a th:href="@{/admin/products/new}" style="color:var(--accent-gold)">Add one →</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
